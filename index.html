<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام حضور جامعة التقنية الشمالية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans Arabic', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .qr-container canvas, .qr-container img { margin: 0 auto; border-radius: 1rem; border: 4px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #reader { width: 100% !important; border: none !important; }
        #reader video { border-radius: 1.5rem; object-fit: cover !important; }
        .animate-in { animation: fadeIn 0.15s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        #admin-modal, #manual-modal, #subject-modal, #pin-modal { display: none; }
        #admin-modal.active, #manual-modal.active, #subject-modal.active, #pin-modal.active { display: flex; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-10">

    <header class="p-4 bg-white shadow-sm border-b text-center sticky top-0 z-50">
        <h1 class="text-blue-700 font-bold text-lg">Northern Technical University</h1>
        <h2 class="text-red-600 font-semibold text-xs">كلية التقنيات الصحية والطبية - كركوك</h2>
    </header>

    <main class="max-w-xl mx-auto p-4" id="app-root">
        <div class="flex items-center justify-center h-64 italic text-slate-400">جاري التحميل...</div>
    </main>

    <!-- Admin Login Modal -->
    <div id="admin-modal" class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl animate-in">
            <h3 class="text-xl font-black mb-6 text-center">دخول الإدارة</h3>
            <div class="space-y-4">
                <input id="adm-user" type="text" placeholder="اسم المستخدم" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none font-bold text-center shadow-inner">
                <input id="adm-pass" type="password" placeholder="كلمة المرور" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-none font-bold text-center shadow-inner">
                <button id="adm-confirm" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl">متابعة</button>
                <button id="adm-cancel" class="w-full py-2 text-slate-400 font-bold text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- PIN Modal -->
    <div id="pin-modal" class="fixed inset-0 z-[120] bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-8 w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-black mb-6 text-center">رمز حماية المواد</h3>
            <div class="space-y-4">
                <input id="subject-pin-input" type="password" placeholder="أدخل الرمز" class="w-full p-4 bg-slate-50 rounded-2xl border-none text-center shadow-inner font-black">
                <button id="btn-pin-confirm" class="w-full py-4 bg-indigo-600 text-white font-black rounded-2xl">دخول</button>
                <button id="btn-pin-cancel" class="w-full py-2 text-slate-400 font-bold text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Subject Modal -->
    <div id="subject-modal" class="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-black mb-4 text-center border-b pb-2">إدارة المواد</h3>
            <div class="space-y-4">
                <input id="new-subject-name" type="text" placeholder="اسم المادة الجديدة" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold shadow-inner">
                <button id="btn-save-subject" class="w-full py-3 bg-indigo-600 text-white font-black rounded-2xl">إضافة</button>
                <div id="current-subjects-list" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto justify-center"></div>
                <button id="subject-close-btn" class="w-full py-2 text-slate-400 font-bold text-sm bg-slate-50 rounded-xl">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Manual Attendance Modal -->
    <div id="manual-modal" class="fixed inset-0 z-[110] bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-sm shadow-2xl">
            <h3 class="text-lg font-black mb-4 text-center border-b pb-2">إضافة حضور يدوي</h3>
            <div class="space-y-4">
                <select id="manual-stu-select" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold shadow-inner"></select>
                <button id="btn-confirm-manual" class="w-full py-4 bg-green-600 text-white font-black rounded-2xl">تثبيت الحضور</button>
                <button id="manual-close-btn" class="w-full py-2 text-slate-400 font-bold text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, addDoc, onSnapshot, query, where, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZfsS5xjUyunwIt_cHaPWHQI3H_lzYXoo",
            authDomain: "ntumlt.firebaseapp.com",
            projectId: "ntumlt",
            storageBucket: "ntumlt.firebasestorage.app",
            messagingSenderId: "658799327665",
            appId: "1:658799327665:web:8841af44d52aa7caa12590"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "ntumlt-attendance-v2";

        let userRole = localStorage.getItem('role') || null;
        let userData = JSON.parse(localStorage.getItem('userData')) || null;
        let adminStage = localStorage.getItem('adminStage') || 'الأولى';
        let adminType = localStorage.getItem('adminType') || 'صباحي';
        let html5QrCode = null;
        let localStudentsCache = {}; 

        const render = (html) => {
            const root = document.getElementById('app-root');
            if (root) { root.innerHTML = `<div class="animate-in">${html}</div>`; lucide.createIcons(); }
        };

        const notify = (msg, isError = false) => {
            const toast = document.createElement('div');
            toast.className = `fixed top-24 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-2xl shadow-2xl text-white font-bold animate-in ${isError ? 'bg-red-500' : 'bg-green-600'}`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        };

        window.deleteEntry = async (type, id) => {
            if (!confirm('حذف؟')) return;
            const coll = type === 'att' ? 'attendance' : 'members';
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', coll, id));
            notify('تم الحذف');
        };

        const showLogin = () => {
            render(`
                <div class="mt-8 bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100">
                    <h3 class="text-2xl font-black text-center mb-6">بوابة الدخول</h3>
                    <div class="space-y-4">
                        <input id="stu-name" type="text" placeholder="الاسم الرباعي" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold text-center shadow-inner">
                        <div class="grid grid-cols-2 gap-2">
                             <select id="stu-stage" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold text-slate-600">
                                <option value="" disabled selected>المرحلة</option>
                                <option value="الأولى">الأولى</option><option value="الثانية">الثانية</option>
                                <option value="الثالثة">الثالثة</option><option value="الرابعة">الرابعة</option>
                            </select>
                             <select id="stu-type" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold text-slate-600">
                                <option value="" disabled selected>الدراسة</option>
                                <option value="صباحي">صباحي</option><option value="مسائي">مسائي</option>
                            </select>
                        </div>
                        <div id="extra-status-container" class="hidden animate-in">
                            <select id="stu-status" class="w-full p-4 bg-blue-50 border border-blue-100 rounded-2xl font-black text-blue-700">
                                <option value="-">طالب اعتيادي ( - )</option>
                                <option value="استضافة">استضافة</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input id="stu-pin" type="password" placeholder="الرمز" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold text-center shadow-inner">
                            <input id="stu-confirm" type="password" placeholder="تأكيد" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold text-center shadow-inner">
                        </div>
                        <button id="btn-stu-login" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl shadow-lg">دخول / إنشاء حساب</button>
                    </div>
                    <button id="open-admin-modal" class="w-full mt-10 py-3 text-slate-400 font-bold text-xs">دخول الإدارة</button>
                </div>
            `);
            const typeSelect = document.getElementById('stu-type');
            const extraContainer = document.getElementById('extra-status-container');
            typeSelect.onchange = () => {
                if(typeSelect.value === 'صباحي') extraContainer.classList.remove('hidden');
                else extraContainer.classList.add('hidden');
            };

            document.getElementById('btn-stu-login').onclick = async () => {
                let name = document.getElementById('stu-name').value.trim();
                const stage = document.getElementById('stu-stage').value;
                const type = document.getElementById('stu-type').value;
                const status = document.getElementById('stu-status').value;
                const pin = document.getElementById('stu-pin').value;
                
                if (name.split(/\s+/).length < 4) return notify('الاسم يجب أن يكون رباعي', true);
                if (!stage || !type || pin !== document.getElementById('stu-confirm').value) return notify('تأكد من البيانات', true);
                
                // إضافة كلمة استضافة للاسم إذا اختارها
                if(type === 'صباحي' && status === 'استضافة') {
                    name = name + " - استضافة";
                }

                const btn = document.getElementById('btn-stu-login'); btn.disabled = true;
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'members'), where("name", "==", name));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    if (snap.docs[0].data().pin === pin) { userData = snap.docs[0].data(); userRole = 'student'; saveS(); showStudent(); }
                    else notify('الرمز خطأ', true);
                } else {
                    const newId = auth.currentUser?.uid || "u_" + Date.now();
                    const newStu = { uid: newId, name, role: 'student', stage, type, pin };
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', newId), newStu);
                    userData = newStu; userRole = 'student'; saveS(); showStudent();
                }
                btn.disabled = false;
            };
            document.getElementById('open-admin-modal').onclick = () => document.getElementById('admin-modal').classList.add('active');
        };

        const saveS = () => { localStorage.setItem('role', userRole); localStorage.setItem('userData', JSON.stringify(userData)); };
        document.getElementById('adm-cancel').onclick = () => document.getElementById('admin-modal').classList.remove('active');
        document.getElementById('adm-confirm').onclick = () => {
            if (document.getElementById('adm-user').value === "NTU" && document.getElementById('adm-pass').value === "NTU_mlt12#45@56") {
                document.getElementById('admin-modal').classList.remove('active');
                userRole = 'admin'; localStorage.setItem('role', 'admin'); showAdmin();
            } else notify('البيانات خاطئة', true);
        };

        const showStudent = () => {
            render(`
                <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 text-center animate-in">
                    <h2 class="text-xl font-black text-blue-800 mb-4">${userData.name}</h2>
                    <div id="qrcode" class="qr-container mb-6"></div>
                    <button id="logout" class="w-full py-4 text-slate-400 font-bold border rounded-2xl mt-4">تسجيل خروج</button>
                </div>
            `);
            new QRCode(document.getElementById("qrcode"), { text: userData.uid, width: 220, height: 220, colorDark: "#1e40af" });
            document.getElementById('logout').onclick = () => { localStorage.clear(); location.reload(); };
        };

        const showAdmin = () => {
            let currentTab = 'scan';
            let currentLogData = [];
            const prefetch = async () => {
                localStudentsCache = {};
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'members'), where('stage', '==', adminStage), where('type', '==', adminType));
                const snap = await getDocs(q);
                snap.forEach(doc => localStudentsCache[doc.id] = doc.data().name);
            };

            const draw = () => {
                render(`
                    <div class="bg-blue-800 p-3 rounded-2xl flex justify-between gap-2 mb-4">
                        <select id="adm-filter-stage" class="bg-blue-700 text-white font-bold rounded-xl p-2 text-xs border-none outline-none">
                            <option value="الأولى" ${adminStage === 'الأولى' ? 'selected' : ''}>الأولى</option>
                            <option value="الثانية" ${adminStage === 'الثانية' ? 'selected' : ''}>الثانية</option>
                            <option value="الثالثة" ${adminStage === 'الثالثة' ? 'selected' : ''}>الثالثة</option>
                            <option value="الرابعة" ${adminStage === 'الرابعة' ? 'selected' : ''}>الرابعة</option>
                        </select>
                        <select id="adm-filter-type" class="bg-blue-700 text-white font-bold rounded-xl p-2 text-xs border-none outline-none">
                            <option value="صباحي" ${adminType === 'صباحي' ? 'selected' : ''}>صباحي</option>
                            <option value="مسائي" ${adminType === 'مسائي' ? 'selected' : ''}>مسائي</option>
                        </select>
                    </div>
                    <nav class="flex bg-white p-2 rounded-3xl shadow-xl gap-2 mb-4">
                        <button id="tab-scan" class="flex-1 py-4 rounded-2xl font-black ${currentTab === 'scan' ? 'bg-blue-600 text-white' : 'text-slate-400'}">المسح</button>
                        <button id="tab-logs" class="flex-1 py-4 rounded-2xl font-black ${currentTab === 'logs' ? 'bg-indigo-600 text-white' : 'text-slate-400'}">الحضور</button>
                        <button id="tab-members" class="flex-1 py-4 rounded-2xl font-black ${currentTab === 'members' ? 'bg-green-600 text-white' : 'text-slate-400'}">الطلاب</button>
                    </nav>
                    <div id="admin-content" class="bg-white p-6 rounded-[2.5rem] shadow-xl min-h-[400px]"></div>
                    <button onclick="localStorage.clear(); location.reload();" class="w-full mt-4 text-slate-300 font-bold text-xs">خروج</button>
                `);
                prefetch();
                document.getElementById('adm-filter-stage').onchange = (e) => { adminStage = e.target.value; localStorage.setItem('adminStage', adminStage); draw(); };
                document.getElementById('adm-filter-type').onchange = (e) => { adminType = e.target.value; localStorage.setItem('adminType', adminType); draw(); };
                document.getElementById('tab-scan').onclick = () => { currentTab = 'scan'; draw(); };
                document.getElementById('tab-logs').onclick = () => { currentTab = 'logs'; draw(); };
                document.getElementById('tab-members').onclick = () => { currentTab = 'members'; draw(); };
                if (currentTab === 'scan') drawScanner(); else if (currentTab === 'logs') drawLogs(); else drawMembers();
            };

            const drawScanner = () => {
                document.getElementById('admin-content').innerHTML = `
                    <div class="space-y-4">
                        <select id="sel-sub" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold text-center shadow-inner"><option>تحميل المواد...</option></select>
                        <div id="reader" class="rounded-[2rem] overflow-hidden"></div>
                        <button id="start-scan" class="w-full py-5 bg-blue-600 text-white font-black rounded-2xl">تشغيل الكاميرا</button>
                    </div>
                `;
                const sel = document.getElementById('sel-sub');
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'subjects'), where('stage', '==', adminStage), where('type', '==', adminType)), s => {
                    sel.innerHTML = s.empty ? '<option>لا توجد مواد</option>' : '';
                    s.forEach(d => sel.innerHTML += `<option>${d.data().name}</option>`);
                });
                document.getElementById('start-scan').onclick = () => {
                    if (sel.value.includes('لا توجد')) return notify('أضف مادة أولاً', true);
                    html5QrCode = new Html5Qrcode("reader");
                    html5QrCode.start({ facingMode: "environment" }, { fps: 60, qrbox: 250 }, text => {
                        if (localStudentsCache[text]) {
                            notify(`تم: ${localStudentsCache[text]}`);
                            addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'attendance'), { 
                                studentId: text, studentName: localStudentsCache[text], subject: sel.value, 
                                stage: adminStage, type: adminType, date: new Date().toISOString().split('T')[0], 
                                time: new Date().toLocaleTimeString('ar-EG'), timestamp: serverTimestamp() 
                            });
                        }
                    });
                    document.getElementById('start-scan').style.display = 'none';
                };
            };

            const drawLogs = () => {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('admin-content').innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center"><h4 class="font-black text-sm">السجل</h4><div class="flex gap-2"><button id="btn-download" class="p-2 bg-green-50 text-green-600 rounded-lg text-[10px] font-black">تنزيل CSV</button><button id="btn-sub" class="p-2 bg-indigo-50 text-indigo-600 rounded-lg text-[10px] font-black">المواد</button></div></div>
                        <div class="grid grid-cols-2 gap-2"><select id="log-sub" class="p-3 bg-slate-50 rounded-xl border-none text-[10px] font-black shadow-inner"></select><input id="log-date" type="date" value="${today}" class="p-3 bg-slate-50 rounded-xl border-none text-[10px] font-black shadow-inner"></div>
                        <div id="attendance-list" class="space-y-2 max-h-[350px] overflow-y-auto no-scrollbar"></div>
                    </div>
                `;
                const lSub = document.getElementById('log-sub');
                const update = () => {
                    if (!lSub.value) return;
                    onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'attendance'), where('stage', '==', adminStage), where('type', '==', adminType), where('subject', '==', lSub.value), where('date', '==', document.getElementById('log-date').value)), s => {
                        currentLogData = s.docs.map(d => ({id: d.id, ...d.data()}));
                        document.getElementById('attendance-list').innerHTML = currentLogData.map(a => `<div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center shadow-sm"><div><p class="font-bold text-sm">${a.studentName}</p><p class="text-[10px] text-slate-400">${a.time}</p></div><button onclick="window.deleteEntry('att', '${a.id}')" class="text-red-400"><i data-lucide="trash-2" size="16"></i></button></div>`).join('') || '<div class="text-center py-10 text-slate-300">لا يوجد بيانات</div>';
                        lucide.createIcons();
                    });
                };
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'subjects'), where('stage', '==', adminStage), where('type', '==', adminType)), s => {
                    lSub.innerHTML = s.docs.map(d => `<option>${d.data().name}</option>`).join(''); update();
                });
                lSub.onchange = update; document.getElementById('log-date').onchange = update;
                
                document.getElementById('btn-download').onclick = () => {
                    let csv = "\uFEFFت,الاسم الرباعي,المادة,التاريخ,وقت الحضور\n";
                    currentLogData.forEach((a, i) => csv += `${i+1},${a.studentName},${a.subject},${a.date},${a.time}\n`);
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `حضور_${lSub.value}.csv`; link.click();
                };

                document.getElementById('btn-sub').onclick = () => {
                    document.getElementById('pin-modal').classList.add('active');
                    document.getElementById('btn-pin-confirm').onclick = () => {
                        if(document.getElementById('subject-pin-input').value === "122109") {
                            document.getElementById('pin-modal').classList.remove('active');
                            document.getElementById('subject-modal').classList.add('active');
                            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'subjects'), where('stage', '==', adminStage), where('type', '==', adminType)), s => {
                                document.getElementById('current-subjects-list').innerHTML = s.docs.map(d => `<button onclick="window.deleteEntry('sub', '${d.id}')" class="bg-red-50 text-red-500 px-3 py-1 rounded-lg text-xs font-bold border border-red-100">${d.data().name} x</button>`).join('');
                            });
                        } else notify('خطأ', true);
                    };
                };
            };

            const drawMembers = () => {
                document.getElementById('admin-content').innerHTML = `<div id="members-list" class="space-y-2 max-h-[350px] overflow-y-auto no-scrollbar"></div>`;
                onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'members'), where('stage', '==', adminStage), where('type', '==', adminType)), s => {
                    document.getElementById('members-list').innerHTML = s.docs.map(d => `<div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center shadow-sm"><div><p class="font-bold text-sm">${d.data().name}</p><p class="text-[10px] text-blue-500">الرمز: ${d.data().pin}</p></div><button onclick="window.deleteEntry('mem', '${d.id}')" class="text-red-400"><i data-lucide="trash-2" size="16"></i></button></div>`).join('');
                    lucide.createIcons();
                });
            };
            draw();
        };

        onAuthStateChanged(auth, u => { if(!u) signInAnonymously(auth); if(userRole) { if(userRole==='admin') showAdmin(); else showStudent(); } else showLogin(); });
        document.getElementById('btn-pin-cancel').onclick = () => document.getElementById('pin-modal').classList.remove('active');
        document.getElementById('subject-close-btn').onclick = () => document.getElementById('subject-modal').classList.remove('active');
        document.getElementById('btn-save-subject').onclick = async () => {
            const name = document.getElementById('new-subject-name').value;
            if(name) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'subjects'), { name, stage: adminStage, type: adminType });
            document.getElementById('new-subject-name').value = '';
        };
    </script>
</body>
</html>
